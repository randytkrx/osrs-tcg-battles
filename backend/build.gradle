plugins {
	id 'java'
}

repositories {
	mavenCentral()
}

sourceSets {
	main {
		java {
			srcDir 'src/main/java'
			srcDir '../src/main/java'
			include 'com/osrstcgbattles/backend/**'
			include 'com/osrstcgbattles/catalog/**'
			include 'com/osrstcgbattles/collection/OwnedCardCollectionStatus.java'
			include 'com/osrstcgbattles/deck/**'
			include 'com/osrstcgbattles/engine/**'
			include 'com/osrstcgbattles/integration/CatalogCardLookup.java'
			include 'com/osrstcgbattles/integration/CatalogDeckFactory.java'
			include 'com/osrstcgbattles/match/MatchView.java'
			include 'com/osrstcgbattles/online/OnlineEnvelope.java'
			include 'com/osrstcgbattles/online/OnlineMessageType.java'
			include 'com/osrstcgbattles/online/RankedAuthentication.java'
			include 'com/osrstcgbattles/online/WireMatchView.java'
		}
		resources {
			srcDir '../src/main/resources'
			include 'com/osrstcgbattles/battle-cards.json'
		}
	}
}

dependencies {
	implementation 'com.google.code.gson:gson:2.13.2'
	implementation 'io.undertow:undertow-core:2.3.26.Final'
	implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
	runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
	testImplementation 'junit:junit:4.13.2'
}

group = 'com.osrstcgbattles'
version = '0.1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(21)
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest {
		attributes('Main-Class': 'com.osrstcgbattles.backend.DuelscapeBackend')
	}
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
	archiveFileName.set('duelscape-backend.jar')
}

test {
	useJUnit()
}
